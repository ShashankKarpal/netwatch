name: Rust

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned to match the local dev toolchain on the M4 Pro.
      # Bump this and the local `rustup update` together, then fix new lints in one commit.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: fmt
        run: cargo fmt --all -- --check

      - name: build
        run: cargo build --verbose

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test --verbose -- --nocapture
