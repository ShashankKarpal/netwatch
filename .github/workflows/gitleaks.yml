name: gitleaks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin to match local dev (brew gitleaks 8.30.1). The action default is
          # 8.24.3, where the global [[allowlists]] paths rule did not suppress
          # the upstream adsfund.json finding on full-history scans.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
